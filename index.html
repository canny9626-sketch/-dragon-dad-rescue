<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1422">
<title>Dragon Dad Rescue</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1422;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#game{position:relative;width:min(100vw,430px);height:100vh;margin:auto;overflow:hidden;background:
radial-gradient(circle at 72% 13%,rgba(255,244,205,.95) 0 5%,transparent 5.3%),
linear-gradient(#83b9dd 0 38%,#dce7ee 38% 43%,#5b7d58 43% 100%)}
#ground{position:absolute;left:0;right:0;bottom:0;height:25%;background:linear-gradient(#486b4d,#21382c)}
#hud{position:absolute;z-index:20;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;font-weight:800}
.pill{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 12px;backdrop-filter:blur(8px)}
#bar{position:absolute;z-index:20;top:62px;left:18px;right:18px;height:10px;background:rgba(0,0,0,.28);border-radius:999px;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#fff,#f5d69b)}
#tip{position:absolute;z-index:20;top:92px;left:22px;right:22px;text-align:center;font-size:20px;font-weight:900;text-shadow:0 2px 8px #0008}
.sprite{position:absolute;transform:translate(-50%,-50%);pointer-events:none;user-select:none}
#baby{z-index:8;width:78px;height:78px;filter:drop-shadow(0 7px 8px #0005)}
#dad{z-index:12;width:130px;height:130px;display:none;filter:drop-shadow(0 10px 12px #0006)}
#rabbit{z-index:7;font-size:44px}
.enemy{z-index:7;font-size:42px}.star{z-index:7;font-size:28px}
#controls{position:absolute;z-index:25;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:12px}
.ctrl{flex:1;height:68px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.18);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;backdrop-filter:blur(10px);touch-action:none}
.ctrl:active{background:rgba(255,255,255,.3);transform:scale(.98)}
.panel{position:absolute;z-index:40;inset:0;display:flex;align-items:center;justify-content:center;padding:26px;background:rgba(6,13,21,.78)}
.card{width:100%;padding:26px 22px;border:1px solid rgba(255,255,255,.18);border-radius:28px;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);text-align:center}
h1{font-size:34px;margin:8px 0 12px}p{font-size:16px;line-height:1.55;color:#edf3f8}
button{width:100%;margin-top:14px;border:0;border-radius:18px;padding:16px 18px;font-size:19px;font-weight:900;background:#fff;color:#13233a}
#endPanel{display:none}.note{font-size:13px;opacity:.8}
</style>
</head>
<body>
<div id="game">
  <div id="ground"></div>
  <div id="hud"><div class="pill">✨ <span id="score">0</span></div><div class="pill">❤️ <span id="lives">3</span></div></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="tip">左右閃躲，撐到龍爸出場！</div>

  <svg id="baby" class="sprite" viewBox="0 0 100 100" aria-hidden="true">
    <ellipse cx="50" cy="61" rx="24" ry="18" fill="#f8f6ef"/>
    <circle cx="56" cy="38" r="17" fill="#fff"/>
    <path d="M44 29 L36 15 L50 24 M62 26 L70 14 L68 31" fill="#f4f0df" stroke="#d9d3c0" stroke-width="2"/>
    <path d="M32 54 Q13 43 18 31 Q35 38 41 49Z" fill="#faf8f2" stroke="#ddd7c8" stroke-width="2"/>
    <path d="M70 56 Q87 43 85 31 Q70 38 64 50Z" fill="#faf8f2" stroke="#ddd7c8" stroke-width="2"/>
    <circle cx="61" cy="36" r="3.8" fill="#caa24b"/>
    <path d="M73 64 Q91 70 85 84 Q72 79 63 70Z" fill="#fff" stroke="#ddd7c8" stroke-width="2"/>
    <path d="M40 76 L34 89 M55 77 L55 90" stroke="#f7f3e9" stroke-width="7" stroke-linecap="round"/>
  </svg>

  <div id="rabbit" class="sprite">🐇</div>

  <svg id="dad" class="sprite" viewBox="0 0 140 140" aria-hidden="true">
    <ellipse cx="70" cy="86" rx="37" ry="26" fill="#f7f6f0"/>
    <circle cx="79" cy="54" r="25" fill="#fff"/>
    <path d="M61 39 L49 20 L69 34 M87 37 L100 18 L98 43" fill="#f5f1df" stroke="#d7d0bd" stroke-width="3"/>
    <path d="M36 77 Q5 53 13 31 Q39 42 50 67Z" fill="#fbfaf5" stroke="#ddd7c8" stroke-width="3"/>
    <path d="M105 78 Q132 55 129 31 Q102 43 92 68Z" fill="#fbfaf5" stroke="#ddd7c8" stroke-width="3"/>
    <circle cx="88" cy="52" r="5" fill="#c79f43"/>
    <path d="M102 92 Q135 101 127 126 Q104 117 88 101Z" fill="#fff" stroke="#ddd7c8" stroke-width="3"/>
    <path d="M54 106 L46 132 M78 108 L78 134" stroke="#f7f3e9" stroke-width="11" stroke-linecap="round"/>
  </svg>

  <div id="controls">
    <div class="ctrl" id="left">◀︎</div>
    <div class="ctrl" id="boost">⚡</div>
    <div class="ctrl" id="right">▶︎</div>
  </div>

  <div class="panel" id="startPanel">
    <div class="card">
      <div style="font-size:68px">🤍🐉🐇</div>
      <h1>Dragon Dad Rescue</h1>
      <p>幫小龍躲開怪物、收集星光，撐到最後讓龍爸出場救援。</p>
      <button id="startBtn">開始救援</button>
      <p class="note">手機：按住左右移動；⚡ 可以短暫加速。</p>
    </div>
  </div>

  <div class="panel" id="endPanel">
    <div class="card">
      <div id="endEmoji" style="font-size:72px">🤍🐲🐉🐇</div>
      <h1 id="endTitle">救援成功！</h1>
      <p id="finalText"></p>
      <button id="againBtn">再玩一次</button>
    </div>
  </div>
</div>

<script>
(() => {
const game=document.getElementById('game'), baby=document.getElementById('baby'), rabbit=document.getElementById('rabbit'), dad=document.getElementById('dad');
const scoreEl=document.getElementById('score'), livesEl=document.getElementById('lives'), fill=document.getElementById('fill'), tip=document.getElementById('tip');
const startPanel=document.getElementById('startPanel'), endPanel=document.getElementById('endPanel');
let W,H,running=false,score=0,lives=3,progress=0,last=0,spawnTimer=0,starTimer=0,x=.5,y=.58,vx=0,boost=0,enemies=[],stars=[],leftHeld=false,rightHeld=false;

function resize(){W=game.clientWidth;H=game.clientHeight;place();}
function place(){baby.style.left=x*W+'px';baby.style.top=y*H+'px';rabbit.style.left=.5*W+'px';rabbit.style.top=.35*H+'px';}
window.addEventListener('resize',resize);resize();

function clearObjects(){enemies.forEach(o=>o.el.remove());stars.forEach(o=>o.el.remove());enemies=[];stars=[];}
function reset(){running=false;clearObjects();score=0;lives=3;progress=0;x=.5;vx=0;boost=0;spawnTimer=0;starTimer=0;scoreEl.textContent='0';livesEl.textContent='3';fill.style.width='0%';dad.style.display='none';tip.textContent='左右閃躲，撐到龍爸出場！';place();}
function spawnEnemy(){const el=document.createElement('div');el.className='enemy sprite';el.textContent=Math.random()<.5?'🐺':'🦇';game.appendChild(el);enemies.push({el,x:.10+Math.random()*.80,y:-.08,s:.00020+Math.random()*.00010});}
function spawnStar(){const el=document.createElement('div');el.className='star sprite';el.textContent='✨';game.appendChild(el);stars.push({el,x:.10+Math.random()*.80,y:-.05,s:.00017});}
function dist(a,b){return Math.hypot((a.x-b.x)*W,(a.y-b.y)*H);}
function updateList(arr,dt,isEnemy){
 for(let i=arr.length-1;i>=0;i--){
   const o=arr[i];o.y+=o.s*dt;o.el.style.left=o.x*W+'px';o.el.style.top=o.y*H+'px';
   if(dist({x,y},o)<(isEnemy?45:38)){
     o.el.remove();arr.splice(i,1);
     if(isEnemy){lives--;livesEl.textContent=lives;tip.textContent='小心！💥';setTimeout(()=>{if(running)tip.textContent='繼續撐住！';},450);if(lives<=0){finish(false);return false;}}
     else{score+=10;scoreEl.textContent=score;}
   } else if(o.y>1.08){o.el.remove();arr.splice(i,1);}
 }
 return true;
}
function rescue(){running=false;dad.style.display='block';dad.style.left='55%';dad.style.top='43%';baby.style.left='43%';baby.style.top='56%';rabbit.style.top='56%';tip.textContent='龍爸來了！ 🤍🐲';setTimeout(()=>finish(true),1100);}
function finish(ok){running=false;endPanel.style.display='flex';document.getElementById('endTitle').textContent=ok?'救援成功！':'差一點點！';document.getElementById('finalText').textContent=ok?`你拿到 ${score} 分，小龍成功撐到龍爸出場！`:`你拿到 ${score} 分，再試一次！`;}
function loop(t){
 if(!running)return;
 const dt=Math.min(36,t-last||16);last=t;
 const dir=(leftHeld?-1:0)+(rightHeld?1:0);
 vx+=dir*.000020*dt;vx*=.86;x+=vx*dt*(boost>0?1.7:1);x=Math.max(.08,Math.min(.92,x));boost=Math.max(0,boost-dt);
 spawnTimer+=dt;starTimer+=dt;progress+=dt/24000;fill.style.width=Math.min(100,progress*100)+'%';
 if(spawnTimer>850){spawnTimer=0;spawnEnemy();}
 if(starTimer>1200){starTimer=0;spawnStar();}
 if(updateList(enemies,dt,true)===false)return;
 if(updateList(stars,dt,false)===false)return;
 place();if(progress>=1){rescue();return;}requestAnimationFrame(loop);
}
function startGame(){reset();startPanel.style.display='none';endPanel.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop);}
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('againBtn').addEventListener('click',startGame);

function bindHold(id,side){
 const el=document.getElementById(id);
 const down=e=>{e.preventDefault();side==='L'?leftHeld=true:rightHeld=true;};
 const up=e=>{e.preventDefault();side==='L'?leftHeld=false:rightHeld=false;};
 ['touchstart','mousedown'].forEach(ev=>el.addEventListener(ev,down,{passive:false}));
 ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev=>el.addEventListener(ev,up,{passive:false}));
}
bindHold('left','L');bindHold('right','R');
['touchstart','mousedown'].forEach(ev=>document.getElementById('boost').addEventListener(ev,e=>{e.preventDefault();boost=650;},{passive:false}));
})();
</script>
</body>
</html>
